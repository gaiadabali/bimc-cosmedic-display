<script>var CFG={"frames":3,"step":4.6,"hold":4.6,"loops":2,"kb":1.06,"photos":true,"subs":true,"icon":false};
(function () {
var ad = document.getElementById('ad');
function param(name) {
name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
var regex = new RegExp('[\\?&]' + name + '=([^&#]*)'),
results = regex.exec(location.search);
return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
}
var clickTAG = param('clickTAG');
function exit() {
if (clickTAG) window.open(clickTAG, '_blank');
}
ad.addEventListener('click', exit, false);
ad.addEventListener('keydown', function (e) {
if (e.key === 'Enter' || e.keyCode === 13) exit();
}, false);
function $(s) { return ad.querySelector(s); }
function $$(s) { return Array.prototype.slice.call(ad.querySelectorAll(s)); }
function loadRest() {
$$('img[data-src]').forEach(function (img) {
img.src = img.getAttribute('data-src');
img.removeAttribute('data-src');
});
}
function showStatic() {
loadRest();
ad.style.opacity = 1;
}
function reducedMotion() {
return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function build() {
var g = window.gsap;
var tl = g.timeline({ paused: true, defaults: { ease: 'power3.out' } });
var step = CFG.step, kb = CFG.kb, n = CFG.frames;
var hasWord = !CFG.icon;
tl.set(ad, { opacity: 1 }, 0);
tl.set('.wash', { autoAlpha: 0 }, 0);
if (CFG.photos) tl.set('.ph', { autoAlpha: 0 }, 0);
if (CFG.subs) tl.set('.sub', { autoAlpha: 0 }, 0);
var brand = [
tl.fromTo('.lg-cross', { autoAlpha: 0, scale: 0.55, transformOrigin: '50% 50%' },
{ autoAlpha: 1, scale: 1, duration: 1.1, ease: 'expo.out' }, 0.05).recent(),
tl.fromTo('.acc', { autoAlpha: 0, x: 6 }, { autoAlpha: 1, x: 0, duration: 0.7 }, 0.15).recent()
];
if (hasWord) {
brand.push(tl.fromTo('.lg-clip', { attr: { width: 0 } },
{ attr: { width: 2800 }, duration: 1.15, ease: 'expo.inOut' }, 0.25).recent());
brand.push(tl.fromTo('.lg-tag', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.8, ease: 'sine.out' }, 0.85).recent());
}
if (CFG.photos) {
tl.fromTo('.p1', { autoAlpha: 0 }, { autoAlpha: 1, duration: 1.1, ease: 'sine.out' }, 0);
tl.fromTo('.p1 img', { scale: kb }, { scale: 1, duration: step + 1.6, ease: 'sine.out' }, 0);
}
if ($('.eb')) {
tl.fromTo('.eb i', { scaleX: 0, transformOrigin: '0% 50%' }, { scaleX: 1, duration: 0.7, ease: 'expo.inOut' }, 0.45);
tl.fromTo('.eb span', { autoAlpha: 0, x: -4 }, { autoAlpha: 1, x: 0, duration: 0.7 }, 0.75);
}
tl.fromTo('.hl .w i', { yPercent: 112 }, { yPercent: 0, duration: 1.15, ease: 'expo.out', stagger: 0.075 }, 0.6);
if (CFG.subs) {
tl.set('.s1', { autoAlpha: 1 }, 1.15);
tl.fromTo('.s1 .pt', { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: 0.8, stagger: 0.16 }, 1.15);
}
tl.fromTo('.cta-bg', { scaleX: 0, transformOrigin: '0% 50%' }, { scaleX: 1, duration: 0.75, ease: 'expo.inOut' }, 1.55);
tl.fromTo('.cta-t', { autoAlpha: 0, y: 4 }, { autoAlpha: 1, y: 0, duration: 0.6 }, 1.95);
tl.fromTo('.cta-ar', { autoAlpha: 0, x: -7 }, { autoAlpha: 1, x: 0, duration: 0.7 }, 2.1);
shine(tl, 3.0);
for (var i = 2; i <= n; i++) {
var t = step * (i - 1);
var last = i === n;
if (CFG.photos) {
tl.fromTo('.p' + i, { autoAlpha: 0 }, { autoAlpha: 1, duration: 1.35, ease: 'sine.inOut' }, t);
tl.fromTo('.p' + i + ' img', { scale: kb },
{ scale: 1, duration: last ? step : step + 1.4, ease: 'sine.out' }, t);
}
if (CFG.subs) {
tl.to('.s' + (i - 1), { autoAlpha: 0, y: -5, duration: 0.45, ease: 'power2.in' }, t);
tl.set('.s' + i, { autoAlpha: 1, y: 0 }, t + 0.5);
tl.fromTo('.s' + i + ' .pt', { autoAlpha: 0, y: 6 },
{ autoAlpha: 1, y: 0, duration: 0.8, stagger: 0.16 }, t + 0.5);
}
tl.to('.cta-ar', { x: 4, duration: 0.35, ease: 'power2.out', yoyo: true, repeat: 3 }, t + 1.7);
if (last) shine(tl, t + 2.6);
}
var end = step * (n - 1) + CFG.hold;
tl.addLabel('end', end);
var plays = 1;
tl.add(function () {
if (plays >= CFG.loops) tl.pause(end); // land exactly on the end frame
}, 'end');
tl.to('.wash', { autoAlpha: 1, duration: 0.8, ease: 'sine.inOut' }, 'end');
tl.eventCallback('onComplete', function () {
plays++;
brand.forEach(function (tw) { tw.kill(); });
tl.restart();
});
return tl;
}
function shine(tl, at) {
tl.fromTo('.cta-sh', { xPercent: -140 }, { xPercent: 360, duration: 1.1, ease: 'power2.inOut' }, at);
}
function start() {
if (!window.gsap || param('end') || reducedMotion()) {
showStatic();
return;
}
var tl = build();
window.__tl = tl; // lets the preview/QA seek the timeline
tl.play(0);
loadRest();
}
function whenFontsReady(cb) {
var done = false;
function go() { if (!done) { done = true; cb(); } }
if (document.fonts && document.fonts.ready) {
document.fonts.ready.then(go);
setTimeout(go, 1200);
} else {
go();
}
}
if (document.readyState === 'complete') {
whenFontsReady(start);
} else {
window.addEventListener('load', function () { whenFontsReady(start); }, false);
}
})();</script>
